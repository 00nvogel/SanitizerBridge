name: Sanitizer bridge
run-name: Bridge ${{ inputs.operation || 'poll' }} ${{ inputs.project || 'all' }}
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [poll, notification, export]
        default: poll
        required: true
      project:
        description: Project directory name (leave empty only for polling all projects)
        type: string
        required: false
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.projects.outputs.matrix }}
      active: ${{ steps.projects.outputs.active }}
      action: ${{ steps.projects.outputs.action }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - id: projects
        env:
          OPERATION: ${{ inputs.operation || 'poll' }}
          PROJECT: ${{ inputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$OPERATION" != poll && -z "$PROJECT" ]]; then
            echo 'A project is required for notification/export' >&2
            exit 1
          fi
          trigger="$OPERATION"
          action=import
          if [[ "$OPERATION" == export ]]; then trigger=manual; action=export; fi
          options=()
          if [[ -n "$PROJECT" ]]; then options+=(--project "$PROJECT"); fi
          matrix=$(python -m bridge matrix --trigger "$trigger" "${options[@]}")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          if [[ "$matrix" == '{"include": []}' ]]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
          else
            echo 'active=true' >> "$GITHUB_OUTPUT"
          fi
  sync:
    needs: select
    if: needs.select.outputs.active == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    concurrency:
      group: sanitizer-bridge-${{ matrix.project }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Synchronize
        env:
          BRIDGE_TOKEN: ${{ secrets[matrix.bridge_secret] }}
          INTERNAL_TOKEN: ${{ secrets[matrix.internal_secret] }}
          CUSTOMER_TOKEN: ${{ secrets[matrix.customer_secret] }}
          BRIDGE_URL: https://github.com/${{ github.repository }}.git
          PROJECT: ${{ matrix.project }}
          ACTION: ${{ needs.select.outputs.action }}
        run: python -m bridge "$ACTION" --project "$PROJECT"
